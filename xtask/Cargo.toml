[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
chrono = { version = "0.4.44", features = ["std"] }
